<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BuiltIn Job Results</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f172a;
        --panel: #111827;
        --panel-strong: #0b1220;
        --row: rgba(148, 163, 184, 0.06);
        --row-hover: rgba(148, 163, 184, 0.12);
        --border: rgba(148, 163, 184, 0.2);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #60a5fa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .table-wrap {
        padding: 24px;
        overflow-x: auto;
      }

      .toolbar {
        display: flex;
        justify-content: space-between;
        padding: 24px 24px 0;
      }

      .toolbar-actions {
        display: flex;
        gap: 8px;
      }

      .filter-button {
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 4px;
        color: var(--text);
        background: var(--panel);
        cursor: pointer;
      }

      .filter-button:hover {
        background: var(--row-hover);
      }

      .select-checkbox {
        width: 16px;
        height: 16px;
        accent-color: var(--accent);
      }

      th.select-column,
      td.select-column {
        width: 48px;
        text-align: center;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
      }

      thead th {
        background: var(--panel-strong);
        color: var(--muted);
        text-align: left;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
      }

      tbody td {
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }

      tbody tr {
        background: var(--row);
      }

      tbody tr:hover {
        background: var(--row-hover);
      }

      tbody tr.read {
        color: var(--muted);
        opacity: 0.6;
      }

      tbody tr:last-child td {
        border-bottom: none;
      }

      td.title {
        font-weight: 600;
      }

      .link-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        border-radius: 0;
        color: var(--text);
        text-decoration: none;
        background: transparent;
        border: none;
        transition: transform 0.15s ease, background 0.15s ease;
      }

      .site-favicon {
        width: 24px;
        height: 24px;
        object-fit: contain;
      }

      .link-button:hover {
        background: rgba(96, 165, 250, 0.18);
        transform: translateY(-1px);
      }

      .empty {
        padding: 24px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <button id="mark-read-button" class="filter-button" type="button">Mark as Read</button>
      <div class="toolbar-actions">
        <button id="filter-button" class="filter-button" type="button">Show All</button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="select-column"><input id="select-all" class="select-checkbox" type="checkbox" aria-label="Select all visible jobs" /></th>
            <th>Title</th>
            <th>Company</th>
            <th>Location</th>
            <th>Link</th>
          </tr>
        </thead>
        <tbody id="jobs-body"></tbody>
      </table>
    </div>

    <script>
      let jobs = [];
      let showAll = false;
      const selectedJobs = new Set();

      const SITE_FAVICONS = {
        'builtincolorado.com': 'https://static.builtin.com/dist/images/favicon.png',
        'www.builtincolorado.com': 'https://static.builtin.com/dist/images/favicon.png',
      };

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function resolveJobUrl(job) {
        const url = job.url || '';
        if (!url) {
          return '#';
        }

        if (/^https?:\/\//i.test(url)) {
          return url;
        }

        return url;
      }

      function resolveFaviconUrl(jobUrl) {
        try {
          const url = new URL(jobUrl);
          return SITE_FAVICONS[url.hostname] || `${url.origin}/favicon.ico`;
        } catch {
          return '';
        }
      }

      function jobKey(job) {
        return `${job.title || ''}|${job.company || ''}|${job.url || ''}`;
      }

      function getVisibleJobs() {
        const visibleJobs = showAll ? jobs : jobs.filter((job) => job.isRead === false);
        return [...visibleJobs].sort((a, b) => {
          const left = (a.title || '').toLowerCase();
          const right = (b.title || '').toLowerCase();
          return left.localeCompare(right);
        });
      }

      function updateSelectAll(sortedJobs) {
        const selectAll = document.getElementById('select-all');
        const selectedCount = sortedJobs.filter((job) => selectedJobs.has(jobKey(job))).length;
        selectAll.checked = sortedJobs.length > 0 && selectedCount === sortedJobs.length;
        selectAll.indeterminate = selectedCount > 0 && selectedCount < sortedJobs.length;
      }

      function renderJobs(jobs) {
        const tbody = document.getElementById('jobs-body');
        const sortedJobs = getVisibleJobs();

        if (!sortedJobs.length) {
          tbody.innerHTML = '<tr><td colspan="5" class="empty">No jobs found.</td></tr>';
          updateSelectAll(sortedJobs);
          return;
        }

        tbody.innerHTML = sortedJobs
          .map((job) => {
            const title = escapeHtml(job.title || '');
            const company = escapeHtml(job.company || '');
            const location = escapeHtml(job.location || '');
            const link = resolveJobUrl(job);
            const favicon = resolveFaviconUrl(link);
            const rowClass = job.isRead ? 'read' : '';
            const key = jobKey(job);
            const checked = selectedJobs.has(key) ? ' checked' : '';

            return `
              <tr class="${rowClass}">
                <td class="select-column"><input class="select-checkbox job-checkbox" type="checkbox" data-job-key="${escapeHtml(key)}"${checked} aria-label="Select ${title}" /></td>
                <td class="title">${title}</td>
                <td>${company}</td>
                <td>${location}</td>
                <td>
                  <a
                    class="link-button"
                    href="${link}"
                    target="_blank"
                    rel="noreferrer noopener"
                    aria-label="Open ${title}"
                    title="Open job posting"
                  >
                    ${favicon ? `<img class="site-favicon" src="${favicon}" alt="" decoding="async" onerror="this.hidden = true" />` : ''}
                  </a>
                </td>
              </tr>
            `;
          })
          .join('');

        tbody.querySelectorAll('.job-checkbox').forEach((checkbox) => {
          checkbox.addEventListener('change', (event) => {
            const target = event.target;
            if (target.checked) {
              selectedJobs.add(target.dataset.jobKey);
            } else {
              selectedJobs.delete(target.dataset.jobKey);
            }
            updateSelectAll(sortedJobs);
          });
        });
        updateSelectAll(sortedJobs);
      }

      document.getElementById('select-all').addEventListener('change', (event) => {
        const checked = event.target.checked;
        getVisibleJobs().forEach((job) => {
          const key = jobKey(job);
          if (checked) {
            selectedJobs.add(key);
          } else {
            selectedJobs.delete(key);
          }
        });
        renderJobs(jobs);
      });

      document.getElementById('mark-read-button').addEventListener('click', () => {
        jobs.forEach((job) => {
          if (selectedJobs.has(jobKey(job))) {
            job.isRead = true;
            selectedJobs.delete(jobKey(job));
          }
        });
        renderJobs(jobs);
      });

      async function loadJobs() {
        try {
          const response = await fetch('./data/search-results.json');
          if (!response.ok) {
            throw new Error(`Failed to fetch jobs: ${response.status}`);
          }

          jobs = await response.json();
          renderJobs(jobs);
        } catch (error) {
          const body = document.getElementById('jobs-body');
          body.innerHTML = `
            <tr>
              <td colspan="5" class="empty">
                Could not load data from ./data/search-results.json.<br />
                Serve the repo with a local web server and open this page from there.
              </td>
            </tr>
          `;
          console.error(error);
        }
      }

      document.getElementById('filter-button').addEventListener('click', () => {
        showAll = !showAll;
        document.getElementById('filter-button').textContent = showAll ? 'Show Unread' : 'Show All';
        renderJobs(jobs);
      });

      loadJobs();
    </script>
  </body>
</html>
