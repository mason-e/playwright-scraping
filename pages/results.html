<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Search Results</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <nav class="page-nav" aria-label="Main navigation">
      <a href="/results.html" aria-current="page">Search Results</a>
      <a href="/apps.html">Applications</a>
    </nav>
    <div class="toolbar">
      <button id="mark-read-button" class="filter-button" type="button">Mark as Read</button>
      <div class="toolbar-actions">
        <button id="filter-button" class="filter-button" type="button">Show All</button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="select-column"><input id="select-all" class="select-checkbox" type="checkbox" aria-label="Select all visible jobs" /></th>
            <th>Title</th>
            <th>Company</th>
            <th>Location</th>
            <th>Link</th>
            <th>Application</th>
            <th>Blacklist</th>
          </tr>
        </thead>
        <tbody id="jobs-body"></tbody>
      </table>
    </div>
    <application-modal id="application-modal"></application-modal>
    <blacklist-modal id="blacklist-modal"></blacklist-modal>

    <script src="/application-modal.js" defer></script>
    <script src="/blacklist-modal.js" defer></script>
    <script>
      let jobs = [];
      let showAll = false;
      const selectedJobs = new Set();

      const SITE_FAVICONS = {
        'builtincolorado.com': 'https://static.builtin.com/dist/images/favicon.png',
        'www.builtincolorado.com': 'https://static.builtin.com/dist/images/favicon.png',
      };

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function resolveJobUrl(job) {
        const url = job.url || '';
        if (!url) {
          return '#';
        }

        if (/^https?:\/\//i.test(url)) {
          return url;
        }

        return url;
      }

      function resolveFaviconUrl(jobUrl) {
        try {
          const url = new URL(jobUrl);
          return SITE_FAVICONS[url.hostname] || `${url.origin}/favicon.ico`;
        } catch {
          return '';
        }
      }

      function jobId(job) {
        return job.id;
      }

      function localDate() {
        const today = new Date();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        return `${today.getFullYear()}-${month}-${day}`;
      }

      function formatRelativeDate(rawDate) {
        if (!rawDate) {
          return 'Recent';
        }

        const date = new Date(rawDate);
        if (Number.isNaN(date.getTime())) {
          return 'Recent';
        }

        const diffDays = Math.max(0, Math.round((Date.now() - date.getTime()) / 86400000));
        if (diffDays === 0) {
          return 'Today';
        }
        if (diffDays === 1) {
          return '1d ago';
        }
        return `${diffDays}d ago`;
      }

      function getVisibleJobs() {
        const visibleJobs = showAll ? jobs : jobs.filter((job) => job.isRead === false);
        return [...visibleJobs].sort((a, b) => {
          const left = (a.title || '').toLowerCase();
          const right = (b.title || '').toLowerCase();
          return left.localeCompare(right);
        });
      }

      function updateSelectAll(sortedJobs) {
        const selectAll = document.getElementById('select-all');
        const selectedCount = sortedJobs.filter((job) => selectedJobs.has(jobId(job))).length;
        selectAll.checked = sortedJobs.length > 0 && selectedCount === sortedJobs.length;
        selectAll.indeterminate = selectedCount > 0 && selectedCount < sortedJobs.length;
      }

      function renderJobs(jobs) {
        const tbody = document.getElementById('jobs-body');
        const sortedJobs = getVisibleJobs();

        if (!sortedJobs.length) {
          tbody.innerHTML = '<tr><td colspan="7" class="empty">No jobs found.</td></tr>';
          updateSelectAll(sortedJobs);
          return;
        }

        tbody.innerHTML = sortedJobs
          .map((job) => {
            const title = escapeHtml(job.title || '');
            const company = escapeHtml(job.company || '');
            const location = escapeHtml(job.location || '');
            const link = resolveJobUrl(job);
            const favicon = resolveFaviconUrl(link);
            const rowClass = [job.isRead ? 'read' : '', job.recentApplication ? 'recent-company' : ''].filter(Boolean).join(' ');
            const id = jobId(job);
            const checked = selectedJobs.has(id) ? ' checked' : '';

            return `
              <tr class="${rowClass}">
                <td class="select-column"><input class="select-checkbox job-checkbox" type="checkbox" data-job-id="${escapeHtml(id)}"${checked} aria-label="Select ${title}" /></td>
                <td class="title">${title}</td>
                <td>${company}</td>
                <td>${location}</td>
                <td>
                  <a
                    class="link-button"
                    href="${link}"
                    target="_blank"
                    rel="noreferrer noopener"
                    aria-label="Open ${title}"
                    title="Open job posting"
                  >
                    ${favicon ? `<img class="site-favicon" src="${favicon}" alt="" decoding="async" onerror="this.hidden = true" />` : ''}
                  </a>
                </td>
                <td class="application-action">
                  <button class="filter-button application-add-button" type="button" data-job-id="${escapeHtml(id)}" aria-label="Add application for ${title}">Add</button>
                </td>
                <td class="application-action">
                  <button class="filter-button blacklist-add-button" type="button" data-job-id="${escapeHtml(id)}" aria-label="Add ${title} to blacklist">Add</button>
                </td>
              </tr>
            `;
          })
          .join('');

        tbody.querySelectorAll('.job-checkbox').forEach((checkbox) => {
          checkbox.addEventListener('change', (event) => {
            const target = event.target;
            if (target.checked) {
              selectedJobs.add(target.dataset.jobId);
            } else {
              selectedJobs.delete(target.dataset.jobId);
            }
            updateSelectAll(sortedJobs);
          });
        });
        tbody.querySelectorAll('.application-add-button').forEach((button) => {
          button.addEventListener('click', () => {
            const job = jobs.find((item) => jobId(item) === button.dataset.jobId);
            if (!job) {
              return;
            }

            document.getElementById('application-modal').show({
              company: job.company || '',
              title: job.title || '',
              appDate: localDate(),
              appMethod: '',
              location: job.location || '',
              contact: '',
              interviewed: false,
              advanced: false,
            });
          });
        });
        tbody.querySelectorAll('.blacklist-add-button').forEach((button) => {
          button.addEventListener('click', () => {
            const job = jobs.find((item) => jobId(item) === button.dataset.jobId);
            if (!job) {
              return;
            }

            document.getElementById('blacklist-modal').show({
              company: job.company || '',
              title: job.title || '',
              location: job.location || '',
            });
          });
        });
        updateSelectAll(sortedJobs);
      }

      document.getElementById('select-all').addEventListener('change', (event) => {
        const checked = event.target.checked;
        getVisibleJobs().forEach((job) => {
          const id = jobId(job);
          if (checked) {
            selectedJobs.add(id);
          } else {
            selectedJobs.delete(id);
          }
        });
        renderJobs(jobs);
      });

      document.getElementById('mark-read-button').addEventListener('click', async (event) => {
        const button = event.currentTarget;
        const selectedIds = [...selectedJobs];
        if (!selectedIds.length) {
          return;
        }

        button.disabled = true;
        try {
          const response = await fetch('/api/jobs/read', {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ids: selectedIds }),
          });
          if (!response.ok) {
            throw new Error(`Failed to mark jobs as read: ${response.status}`);
          }

          jobs.forEach((job) => {
            if (selectedJobs.has(jobId(job))) {
              job.isRead = true;
              selectedJobs.delete(jobId(job));
            }
          });
          renderJobs(jobs);
        } catch (error) {
          console.error(error);
          window.alert('Could not save read status. Please try again.');
        } finally {
          button.disabled = false;
        }
      });

      async function loadJobs() {
        try {
          const response = await fetch('/api/jobs');
          if (!response.ok) {
            throw new Error(`Failed to fetch jobs: ${response.status}`);
          }

          jobs = await response.json();
          renderJobs(jobs);
        } catch (error) {
          const body = document.getElementById('jobs-body');
          body.innerHTML = `
            <tr>
              <td colspan="7" class="empty">
                Could not load jobs from the local server API.
              </td>
            </tr>
          `;
          console.error(error);
        }
      }

      document.getElementById('filter-button').addEventListener('click', () => {
        showAll = !showAll;
        document.getElementById('filter-button').textContent = showAll ? 'Show Unread' : 'Show All';
        renderJobs(jobs);
      });

      loadJobs();
    </script>
  </body>
</html>
